<title>Under the Bed</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Pirata+One&display=swap">
<style>
/* layout: one dark column. a thin bar, the painted room filling what is left, a caption strip under it. */
:root{
  color-scheme:dark;
  --ink:#0B0B0D; --bone:#E8E2D6; --blood:#8B0A1A; --gold:#C9A227;
  --bone-dim:#8f8a80; --ink-soft:#1a1819;
  --display:"Pirata One","UnifrakturCook","Times New Roman",serif;
  --text:"IM Fell English","Iowan Old Style",Georgia,serif;
  --u:3px;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ink);color:var(--bone);font-family:var(--text);font-size:18px;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#app{height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:6px;padding-block:8px}
#bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex:none}
#bar .name{font-family:var(--display);font-size:27px;line-height:1;color:var(--bone)}
.switch{display:flex;border:1px solid var(--bone-dim);border-radius:2px;overflow:hidden}
.switch button{font:inherit;font-size:13px;letter-spacing:.12em;line-height:1;padding:8px 9px;border:0;background:var(--ink);color:var(--bone-dim);cursor:pointer}
.switch button[aria-pressed="true"]{background:var(--bone);color:var(--ink)}
.switch button:focus-visible,#begin:focus-visible,.card:focus-visible,#frame:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#stage{flex:1;min-height:0;display:flex;align-items:flex-end;justify-content:center}
#frame{position:relative;flex:none;touch-action:none;cursor:none;border-radius:3px;overflow:hidden;box-shadow:0 0 0 1px var(--ink-soft)}
#c{display:block;width:100%;height:100%}
#cards{position:absolute;left:4%;right:4%;bottom:3%;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3%;align-items:end;cursor:default}
.card{font:inherit;font-style:italic;font-size:clamp(14px,calc(var(--u)*5.4),25px);line-height:1.02;text-align:left;color:var(--ink);
  background:linear-gradient(160deg,#f1ebdf,#d9d1c2 70%,#c5bcab);border:0;border-radius:2px;
  box-shadow:0 calc(var(--u)*1) calc(var(--u)*3) rgba(0,0,0,.7),inset 0 0 0 1px rgba(11,11,13,.25);
  padding:calc(var(--u)*2.4) calc(var(--u)*2.6);min-height:calc(var(--u)*22);
  cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;gap:calc(var(--u)*2);min-width:0;overflow-wrap:anywhere;
  animation:deal .6s cubic-bezier(.2,.8,.3,1) both}
.card:nth-child(1){transform:rotate(-3deg)}
.card:nth-child(2){transform:translateY(calc(var(--u)*-3)) rotate(1deg);animation-delay:.12s}
.card:nth-child(3){transform:rotate(3deg);animation-delay:.24s}
.card i{display:block;width:calc(var(--u)*4.4);height:calc(var(--u)*4.4);border-radius:50%;flex:none;
  background:radial-gradient(circle at 35% 30%,#b3192c,var(--blood) 55%,#4d0610)}
.card:hover,.card:focus-visible{background:linear-gradient(160deg,#fff8ea,#eadfc9);box-shadow:0 calc(var(--u)*1) calc(var(--u)*4) rgba(0,0,0,.8),0 0 0 2px var(--gold)}
@keyframes deal{from{opacity:0;translate:0 calc(var(--u)*10)}to{opacity:1;translate:0 0}}
#start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*4);
  background:radial-gradient(circle at 50% 62%,#1d1712,var(--ink) 62%);text-align:center;cursor:default;padding:8%}
#start h1{font-family:var(--display);font-weight:400;font-size:calc(var(--u)*24);line-height:.9;margin:0;text-wrap:balance}
#start p{margin:0;color:var(--bone-dim);font-style:italic;font-size:clamp(16px,calc(var(--u)*6),25px);line-height:1.1;max-width:22em}
#begin{font:inherit;font-size:clamp(17px,calc(var(--u)*6.4),27px);line-height:1;color:var(--ink);background:var(--gold);border:0;border-radius:2px;padding:.5em .9em;cursor:pointer}
#begin:disabled{opacity:.6}
#caption{flex:none;height:4.3em;font-size:clamp(19px,4.6vw,26px);line-height:1.08;display:flex;align-items:center;justify-content:center;text-align:center;
  max-width:34em;width:100%;margin-inline:auto}
#caption .w{opacity:.16;transition:opacity .12s}
#caption .w.on{opacity:1}
#caption.hint{color:var(--bone-dim);font-style:italic}
#caption .it{white-space:nowrap}
#caption .it.done{color:var(--gold);text-decoration:line-through;text-decoration-color:var(--blood)}
#caption .lead{color:var(--bone)}
#foot{flex:none;display:flex;justify-content:space-between;align-items:center;gap:12px;white-space:nowrap;font-size:13px;color:var(--bone-dim);letter-spacing:.04em;line-height:1}
#note{min-width:0;display:flex;align-items:center;gap:8px}
#nights{display:flex;gap:4px}
#nights b{width:7px;height:7px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--bone-dim)}
#nights b.told{background:var(--blood);box-shadow:none}
#nights b.now{box-shadow:inset 0 0 0 1px var(--gold);background:rgba(201,162,39,.35)}
@media (prefers-reduced-motion:reduce){.card{animation:none}#caption .w{transition:none}}
</style>

<div id="app">
  <div id="bar">
    <span class="name">Under the Bed</span>
    <div class="switch" role="group" aria-label="sound mode">
      <button id="m-beeps" type="button" aria-pressed="false">BEEPS</button>
      <button id="m-el" type="button" aria-pressed="true">ELEVENLABS</button>
    </div>
  </div>
  <div id="stage">
    <div id="frame" tabindex="0" aria-label="a dark bedroom. move your flashlight under the bed, then press the eyes.">
      <canvas id="c"></canvas>
      <div id="cards" hidden></div>
      <div id="start">
        <h1>Under the Bed</h1>
        <p>six nights. six stories. something under the bed wants you to find a few things first.</p>
        <button id="begin" type="button">switch on the flashlight</button>
      </div>
    </div>
  </div>
  <div id="caption" class="hint" aria-live="polite"></div>
  <div id="foot"><span id="note"><span id="nights" aria-hidden="true"></span><span id="status"></span></span><span>built with claude + elevenlabs mcp</span></div>
</div>

<script>
(() => {
'use strict';
/* ───────────── text (approved) ───────────── */
const STORIES = [
 {id:'mirror', obj:'mirror', title:'the mirror that kept faces',
  text:"a mirror in the hall kept every face it was shown. the vain, the tired, the ones only checking their teeth. it pressed them behind the glass like flowers. one night a girl looked in and saw nothing. the mirror had no face of its own. so she drew one with her finger. it is still smiling, crookedly."},
 {id:'candle', obj:'candle', title:'the candle who was afraid of the dark',
  text:"a candle was afraid of the dark, which is awkward in a candle. every night it burned as hard as it could, and every night it grew a little shorter. at last it was only a puddle with a wick. it went out. and the dark, who had been waiting years to say so, whispered: thank you for the company."},
 {id:'musicbox', obj:'musicbox', title:'the music box at 3am',
  text:"every night at three, the music box played by itself. the family blamed the cat, then the pipes, then each other. the boy stayed up to catch the ghost. the lid opened. the little dancer turned once, looked at him, and yawned. she was not haunted. she was practising. the daytime, she explained, has far too many critics."},
 {id:'ghosts', obj:'painting', title:'the girl who painted ghosts',
  text:"a girl painted ghosts, because nobody else would sit still for her. pale ladies. a sailor, still dripping. a dog made of fog. she hung them in the cold corridor, and each morning one more frame was empty. she was not frightened. she had only wanted them to feel at home. now someone always leaves the kettle warm."},
 {id:'door', obj:'door', title:'the door with no room behind it',
  text:"at the top of the stairs stood a door with no room behind it. open it, and there was only wall. still, every night, someone knocked from the other side. politely. three times. one night the boy knocked back. a pause. then a small voice said: oh, good. i was starting to think i was the one who wasn't there."},
 {id:'attic', obj:'bear', title:'the last toy in the attic',
  text:"the last toy in the attic was a bear with one eye and no name. the others had been carried downstairs, loved, and lost. he waited forty years in the dust. then the hatch opened, and an old man climbed up, slowly. he was not looking for a toy. he was looking for the only one who remembered him small."}
];
const INTROS = [
 "oh. you found me. don't scream, it's rude. pick a story.",
 "yes, i live down here. the rent is reasonable. choose one.",
 "i'm not here to scare you. i'm too tired. three stories. take one."
];
const NIGHTS = [
 "that's all. close your eyes. i'll keep watch on the dust.",
 "goodnight. if something creaks, it's only me, getting comfortable.",
 "sleep now. i'll be underneath, as usual. someone has to be."
];
/* ElevenLabs assets are embedded here once generated: name -> data URI, plus word timings per voice line. */
const ASSETS = /*ASSETS*/{}/*END*/;
const TIMINGS = /*TIMINGS*/{}/*END*/;
const EL_READY = Object.keys(ASSETS).length > 0;

/* ───────────── palette: tints of ink, bone, blood, gold only ───────────── */
const P = {
 ink:'#0B0B0D', ink2:'#151315', ink3:'#221f1f', ink4:'#3d3733', ink5:'#5e554d',
 bone:'#E8E2D6', bone2:'#b9b3a8', bone3:'#7d776f', white:'#f5f1e9',
 red:'#8B0A1A', red2:'#5c0711', red3:'#36060c',
 gold:'#C9A227', gold2:'#8a6f1a', gold3:'#4a3d1e', goldhi:'#e6cf7a',
 wood:'#2a2317', wood2:'#3f3420', wood3:'#5a4a26',
 skin:'#E8E2D6', skin2:'#c9c0b2', skin3:'#a89f92', lid:'#d3c8ba', blush:'#d9a79b', ring:'#8d7670', freck:'#b08f80',
 hair:'#3d3733', hair2:'#5e554d', hair3:'#26221f', shirt:'#6a625a', shirt2:'#39332f'
};
const W = 160, H = 150, TAU = Math.PI*2;
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
const mk = (w,h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const hash = n => { const s = Math.sin(n*127.1)*43758.5453; return s-Math.floor(s); };
const lerp = (a,b,k) => a+(b-a)*k, clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const ease = k => k<.5 ? 2*k*k : 1-Math.pow(-2*k+2,2)/2;
const A = (hex,a) => { const n = parseInt(hex.slice(1),16); return `rgba(${n>>16},${n>>8&255},${n&255},${a})`; };

/* tiny painting kit, all in room units (160 x 150) */
const E = (g,x,y,rx,ry,fill,rot=0) => { g.beginPath(); g.ellipse(x,y,rx,ry===undefined?rx:ry,rot,0,TAU); g.fillStyle = fill; g.fill(); };
function RR(g,x,y,w,h,r,fill){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); if(fill){ g.fillStyle = fill; g.fill(); } }
const LG = (g,x0,y0,x1,y1,...st) => { const gr = g.createLinearGradient(x0,y0,x1,y1); st.forEach(([o,c]) => gr.addColorStop(o,c)); return gr; };
const RG = (g,x,y,r0,r1,...st) => { const gr = g.createRadialGradient(x,y,r0,x,y,r1); st.forEach(([o,c]) => gr.addColorStop(o,c)); return gr; };
function ST(g,col,w,f){ g.beginPath(); f(g); g.strokeStyle = col; g.lineWidth = w; g.lineCap = 'round'; g.lineJoin = 'round'; g.stroke(); }
function FP(g,fill,f){ g.beginPath(); f(g); g.closePath(); g.fillStyle = fill; g.fill(); }
const glow = (g,x,y,r,col,a) => { g.fillStyle = RG(g,x,y,0,r,[0,A(col,a)],[1,A(col,0)]); g.fillRect(x-r,y-r,r*2,r*2); };

const GAP = {x:80,y:84,w:72,h:26};
const TOY = {x:114,y:100};

/* ───────────── the six hunts: three things to find before each story ───────────── */
const key = (g,x,y,rot) => { g.save(); g.translate(x,y); g.rotate(rot); ST(g,P.gold,.7,c => { c.arc(-2,0,1.3,0,TAU); c.moveTo(-.7,0); c.lineTo(3.4,0); c.moveTo(2.4,0); c.lineTo(2.4,1.1); c.moveTo(3.4,0); c.lineTo(3.4,1.3); }); g.restore(); };
const HUNT = {
 mirror:[ {x:98,y:33,r:11,label:'the mirror'},
   {x:36,y:133,r:8,label:'a pressed flower',draw(g){ ST(g,P.bone3,.5,c => { c.moveTo(36,137); c.quadraticCurveTo(35,134,36,132); }); for(let i=0;i<5;i++) E(g,36+Math.cos(i*TAU/5)*1.5,131+Math.sin(i*TAU/5)*1.5,1.2,.8,P.blush,i*TAU/5); E(g,36,131,.7,.7,P.red); }},
   {x:41,y:52,r:8,label:'a smile on the glass',draw(g){ E(g,39.6,50.5,.5,.5,A(P.bone,.8)); E(g,42.4,50.5,.5,.5,A(P.bone,.8)); ST(g,A(P.bone,.8),.5,c => { c.moveTo(38.6,52.6); c.quadraticCurveTo(41,55.2,43.6,52.2); }); }} ],
 candle:[ {x:48,y:70,r:9,label:'the candle'},
   {x:27,y:111,r:8,label:'a box of matches',draw(g){ g.save(); g.translate(27,111); g.rotate(-.3); RR(g,-3,-1.7,6,3.4,.4,P.gold3); g.fillStyle = P.red; g.fillRect(-3,-1.7,6,1); ST(g,P.bone2,.4,c => { c.moveTo(1,2.6); c.lineTo(5.5,1.2); }); E(g,5.8,1.1,.6,.5,P.red); g.restore(); }},
   {x:67,y:109,r:8,label:'a puddle of wax',draw(g){ E(g,67,109,4,1.4,P.bone2); E(g,66.3,108.7,2.4,.8,P.bone); ST(g,P.ink,.4,c => { c.moveTo(67,108.6); c.lineTo(67.3,107.2); }); }} ],
 musicbox:[ {x:60,y:75,r:9,label:'the music box'},
   {x:30,y:139,r:8,label:'a tiny key',draw(g){ key(g,30,139,.4); }},
   {x:71,y:24,r:8,label:'the clock at three'} ],
 ghosts:[ {x:131,y:30,r:12,label:'the painting'},
   {x:52,y:117,r:8,label:'a paintbrush',draw(g){ g.save(); g.translate(52,117); g.rotate(.25); ST(g,P.wood3,.9,c => { c.moveTo(-5,0); c.lineTo(2,0); }); ST(g,P.gold,1,c => { c.moveTo(2,0); c.lineTo(3.4,0); }); FP(g,P.red,c => { c.moveTo(3.4,-.8); c.quadraticCurveTo(6.4,0,3.4,.8); }); g.restore(); }},
   {x:30,y:99,r:8,label:'a warm kettle',draw(g,t){ E(g,30,100.6,3.6,2.8,LG(g,26,98,34,103,[0,P.gold2],[1,P.gold3])); RR(g,28.4,97.2,3.2,1,.4,P.gold3); ST(g,P.gold3,.8,c => { c.moveTo(33.2,100); c.quadraticCurveTo(35.6,99.4,35.8,97.4); }); ST(g,P.gold2,.6,c => { c.arc(30,97.6,2.6,Math.PI*1.1,Math.PI*1.9); });
     for(let i=0;i<2;i++){ const s = Math.sin(t*1.4+i*2)*1.2; ST(g,A(P.bone,.28),.5,c => { c.moveTo(35.8+i,96.6); c.bezierCurveTo(34.6+s,94.6,37.4-s,92.8,36+s,90.6); }); } }} ],
 door:[ {x:14,y:68,r:13,label:'the door'},
   {x:39,y:64,r:8,label:'a key on the sill',draw(g){ key(g,39,64.4,0); }},
   {x:15,y:104,r:8,label:'a note under the door',draw(g){ FP(g,P.bone,c => { c.moveTo(11,102.6); c.lineTo(18.6,102.4); c.lineTo(19.6,105.6); c.lineTo(10.4,106); }); ST(g,A(P.ink,.5),.3,c => { c.moveTo(12,103.8); c.lineTo(17.6,103.6); c.moveTo(12,104.8); c.lineTo(16,104.7); }); }} ],
 attic:[ {x:91,y:50,r:10,label:'the bear'},
   {x:60,y:123,r:8,label:'a lost button eye',draw(g){ E(g,60,123,1.6,1.3,P.wood3); E(g,60,123,1.6,1.3,A(P.ink,.25)); E(g,59.5,123,.3,.3,P.ink); E(g,60.5,123,.3,.3,P.ink); }},
   {x:22,y:117,r:8,label:'a wooden block',draw(g){ g.save(); g.translate(22,117); g.rotate(-.15); RR(g,-2.6,-2.6,5.2,5.2,.5,P.gold2); RR(g,-1.8,-1.8,3.6,3.6,.3,P.red2); ST(g,P.bone,.5,c => { c.moveTo(-.9,1); c.lineTo(0,-1.1); c.lineTo(.9,1); c.moveTo(-.5,.2); c.lineTo(.5,.2); }); g.restore(); }} ]
};
const LIGHT_R = [27,25,23,21,19,17];           // the flashlight shrinks a little every night
const HINT_AFTER = [9,11,13,15,18,22];          // seconds before the next thing gives itself away

/* ───────────── the room (painted once per size) ───────────── */
function paintRoom(g){
  // wall
  g.fillStyle = LG(g,0,0,0,104,[0,'#121012'],[1,'#201b1c']); g.fillRect(0,0,W,104);
  for(let y=6;y<80;y+=9) for(let x=(y%18?3:7.5);x<W;x+=9){ ST(g,A(P.bone,.03),.35,c => { c.moveTo(x,y-2); c.quadraticCurveTo(x+2,y,x,y+2); c.quadraticCurveTo(x-2,y,x,y-2); }); E(g,x,y,.3,.3,A(P.bone,.04)); }
  g.fillStyle = LG(g,0,80,0,104,[0,'#1b1617'],[1,'#110e0f']); g.fillRect(0,80,W,24);
  for(let x=5;x<W;x+=11) ST(g,A(P.ink,.6),.4,c => { c.moveTo(x,81); c.lineTo(x,100); });
  ST(g,A(P.bone,.09),.4,c => { c.moveTo(0,80); c.lineTo(W,80); });
  g.fillStyle = '#231e1d'; g.fillRect(0,100,W,4); ST(g,A(P.bone,.07),.3,c => { c.moveTo(0,100); c.lineTo(W,100); });
  // floor boards running toward the wall
  g.fillStyle = LG(g,0,104,0,150,[0,'#15110e'],[1,'#2a2119']); g.fillRect(0,104,W,46);
  for(let i=-16;i<=16;i++) ST(g,A(P.ink,.65),.45,c => { c.moveTo(80+i*8,104); c.lineTo(80+i*25,150); });
  for(let i=0;i<22;i++){ const y = 106+hash(i)*42, x = hash(i+40)*W; ST(g,A(P.ink,.5),.35,c => { c.moveTo(x,y); c.lineTo(x+4+hash(i+7)*5,y); }); }
  FP(g,A(P.bone,.05),c => { c.moveTo(32,106); c.lineTo(62,106); c.lineTo(54,146); c.lineTo(6,146); });      // pale light from the window
  // rug
  FP(g,LG(g,0,120,0,148,[0,P.red3],[1,P.red2]),c => { c.moveTo(20,120); c.lineTo(120,120); c.lineTo(129,147); c.lineTo(11,147); });
  ST(g,A(P.gold2,.5),.5,c => { c.moveTo(24,123); c.lineTo(116,123); c.lineTo(123,144); c.lineTo(17,144); c.closePath(); });
  for(let x=30;x<112;x+=10){ FP(g,A(P.gold3,.8),c => { c.moveTo(x,131); c.lineTo(x+2.4,133.5); c.lineTo(x,136); c.lineTo(x-2.4,133.5); }); E(g,x+5,133.5,.6,.6,A(P.red,.8)); }
  for(let i=0;i<14;i++){ const k = i/13, yl = lerp(120.5,146.5,k); ST(g,A(P.bone3,.7),.4,c => { c.moveTo(lerp(20,11,k),yl); c.lineTo(lerp(20,11,k)-2.2,yl+.6); c.moveTo(lerp(120,129,k),yl); c.lineTo(lerp(120,129,k)+2.2,yl+.6); }); }
  // door
  RR(g,2,33,24,69,1.5,'#2b2523'); RR(g,4,35,20,67,1,LG(g,4,0,24,0,[0,'#191515'],[1,'#2a2422']));
  [[6.5,39,15,25],[6.5,68,15,29]].forEach(([x,y,w,h]) => { RR(g,x,y,w,h,.8,A(P.ink,.55)); RR(g,x+.8,y+.8,w-1.6,h-1.6,.6,'#221d1c'); });
  E(g,21.6,66.5,1.4,1.4,RG(g,21.2,66,0,1.6,[0,P.goldhi],[1,P.gold2])); E(g,21.6,69.6,.5,.7,P.ink);
  // gothic window
  const arch = c => { c.moveTo(34,66); c.lineTo(34,34); c.quadraticCurveTo(35,20,48,14); c.quadraticCurveTo(61,20,62,34); c.lineTo(62,66); };
  FP(g,LG(g,0,14,0,66,[0,'#0c0b0d'],[1,'#191617']),arch);
  g.save(); g.beginPath(); arch(g); g.clip();
  glow(g,52,31,17,P.bone,.22); E(g,52,31,5.2,5.2,RG(g,50.6,29.6,0,5.6,[0,P.white],[1,P.bone2])); E(g,53.6,32.4,1,1,A(P.bone3,.5)); E(g,50.4,29.4,.7,.7,A(P.bone3,.4));
  [[38,24],[57,23],[41,49],[56,46],[37,38],[44,20]].forEach(([x,y]) => E(g,x,y,.3,.3,A(P.bone,.6)));

      if(i%3===0) tone(N[BASS[(i/3|0)%BASS.length]]/2,1.5,{g:story?.1:.07,a:.05}); }); },
    wind(){ every('wind',2600,i => tone(190+hash(i)*90,2.6,{f2:170+hash(i+3)*120,g:.035,a:1.1})); },
    heartbeat(){ every('heartbeat',1050,() => { tone(90,.16,{f2:50,g:.3}); tone(80,.14,{f2:46,g:.22,t:.2}); }); },
    musicbox(){ every('musicbox',300,i => { const n = BOX[i%BOX.length]; if(n) tone(N[n],.5,{g:.05,a:.004}); }); },
    candle(){ every('candle',170,i => { if(hash(i*3.1)>.6) tone(2400+hash(i)*900,.02,{type:'triangle',g:.025}); }); }
  };

  /* ELEVENLABS: files generated through the ElevenLabs MCP, embedded as base64 */
  const b64 = s => { const bin = atob(s.slice(s.indexOf(',')+1)), u = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i); return u.buffer; };
  const decode = name => bufs[name] || (bufs[name] = new Promise((res,rej) => ac.decodeAudioData(b64(ASSETS[name]),res,rej)));
  const ELSFX = { click:['flashlight-click',.9], creak:['bed-creak',.8], slideOut:['slide-out',1], slideBack:['slide-back',1] };
  const ELLOOP = { lullaby:['dark-lullaby',.2,1.5], wind:['window-wind',.3,.6], heartbeat:['heartbeat',.45,.06], musicbox:['music-box',.28,1], candle:['candle-flicker',.6,.3] };
  function elShot(key){
    if(key==='found'){ decode('music-box').then(buf => { const s = ac.createBufferSource(), g = ac.createGain(), t = ac.currentTime; s.buffer = buf;
      g.gain.setValueAtTime(.5,t); g.gain.setValueAtTime(.5,t+1.1); g.gain.linearRampToValueAtTime(0,t+1.7); s.connect(g); g.connect(out); s.start(t,0,1.8); }).catch(()=>{}); return; }
    const m = ELSFX[key]; if(!m) return; decode(m[0]).then(buf => { const s = ac.createBufferSource(), g = ac.createGain(); s.buffer = buf; g.gain.value = m[1]; s.connect(g); g.connect(out); s.start(); }).catch(()=>{}); }

      s.buffer = buf; gn.gain.setValueAtTime(0,t); gn.gain.linearRampToValueAtTime(g,t+xf); gn.gain.setValueAtTime(g,t+D-xf); gn.gain.linearRampToValueAtTime(0,t+D);
      s.connect(gn); gn.connect(st.bus); s.start(t); st.timer = setTimeout(go,(D-xf)*1000); })(); }).catch(()=>{}); }

    const t = ac.currentTime; st.bus.gain.setValueAtTime(st.bus.gain.value,t); st.bus.gain.linearRampToValueAtTime(0,t+.7); setTimeout(() => st.bus.disconnect(),900); }

  function stopLoop(key){ clearInterval(timers[key]); delete timers[key]; elStop(key); }
  let voiceNow = null;
  return {
    init, el, get mode(){ return mode; }, get ac(){ return ac; },
    preload(){ if(!EL_READY || !ac) return Promise.resolve();
      const names = [...Object.values(ELSFX), ...Object.values(ELLOOP)].map(m => m[0]).concat(['intro1','intro2','intro3']);
      return Promise.all(names.map(n => decode(n).catch(()=>{}))); },
    setMode(m){ if(m===mode) return; const on = [...active]; if(ac) on.forEach(stopLoop); mode = m; if(ac) on.forEach(startLoop); if(!el()) this.stopVoice(); },
    sfx(name,arg){ if(!ac) return; if(el()) elShot(name); else (beeps[name]||(()=>{}))(arg); },
    loop(name,on){ if(!ac) return; if(on){ active.add(name); startLoop(name); } else { active.delete(name); stopLoop(name); } },
    setStory(s){ story = s; const l = playing.lullaby; if(l) l.bus.gain.linearRampToValueAtTime(s?.6:1,ac.currentTime+1); },
    async voice(id){ const buf = await decode(id); const s = ac.createBufferSource(); s.buffer = buf; s.connect(voiceBus); const t0 = ac.currentTime+.05; s.start(t0);
      this.stopVoice(); voiceNow = s; if(id.startsWith('story-')) delete bufs[id]; return { t0, dur:buf.duration }; },
    stopVoice(){ if(voiceNow){ try{ voiceNow.stop(); }catch(e){} voiceNow = null; } },
    resume(){ if(ac && ac.state==='suspended') ac.resume(); }
  };
})();

/* ───────────── state ───────────── */
const S = { phase:'title', lx:40, ly:60, slide:0, eyes:0, talk:false, wave:false, story:null, storyT:0, told:[], run:0, lastCreak:0, hunt:null };
const cap = $('caption'), cards = $('cards');
const wait = ms => new Promise(r => setTimeout(r,ms));
const night = () => Math.min(S.told.length+1,6);
function hint(t){ cap.className = 'hint'; cap.textContent = t; }
function status(){ const n = $('nights'); n.textContent = '';
  for(let i=0;i<6;i++){ const b = document.createElement('b'); if(i<S.told.length) b.className = 'told'; else if(i===S.told.length && S.phase!=='title') b.className = 'now'; n.appendChild(b); }
  $('status').textContent = S.phase==='title' ? '' : S.told.length>=6 ? 'all six told' : 'night '+night()+' of 6'; }

/* captions: one sentence-sized chunk at a time, words lit as he says them */
function chunks(text){ const parts = text.match(/[^.?!:]+[.?!:]+/g) || [text], out = [];
  for(const p of parts.map(s => s.trim())){ if(out.length && (out[out.length-1]+' '+p).length < 46) out[out.length-1] += ' '+p; else out.push(p); }
  return out; }
function showChunk(c){ cap.className = ''; cap.textContent = ''; const line = document.createElement('span');
  const spans = c.split(' ').map(w => { const sp = document.createElement('span'); sp.className = 'w'; sp.textContent = w+' '; line.appendChild(sp); return sp; });
  cap.appendChild(line); return spans; }
/* ELEVENLABS: captions follow the real word timings of the recorded line */
function speakEL(text,id){
  const tm = TIMINGS[id], run = S.run, groups = []; let k = 0;
  for(const c of chunks(text)){ const n = c.split(' ').length; groups.push({ c, from:k, to:k+n }); k += n; }
  return Snd.voice(id).then(({ t0, dur }) => new Promise(res => { let cur = -1, spans = []; (function tick(){
    if(run!==S.run || !Snd.el()){ Snd.stopVoice(); S.talk = false; return res(run===S.run ? Math.max(cur,0) : -1); }
    const t = Snd.ac.currentTime-t0; let g = 0;
    for(let i=0;i<groups.length;i++) if(tm[groups[i].from][1]-.12<=t) g = i;
    if(g!==cur){ cur = g; spans = showChunk(groups[g].c); }
    let talking = false;
    for(let i=groups[g].from;i<groups[g].to;i++){ const w = tm[i]; if(w[1]<=t) spans[i-groups[g].from].classList.add('on'); if(w[1]<=t && t<w[2]) talking = true; }
    S.talk = talking;
    if(t>=dur+.35){ S.talk = false; return res(-1); }
    requestAnimationFrame(tick); })(); }));
}
async function speak(text,id){
  let from = 0;
  if(Snd.el() && TIMINGS[id] && TIMINGS[id].length===text.split(' ').length){ try { from = await speakEL(text,id); if(from<0) return; } catch(e){} }
  const run = S.run; let n = 0;
  for(const c of chunks(text).slice(from)){
    const spans = showChunk(c);
    for(const s of spans){ if(run!==S.run) return;
      s.classList.add('on'); S.talk = true; Snd.sfx('blip',n++);
      const w = s.textContent.trim(); await wait(120+w.length*38); S.talk = false;
      await wait(/[.?!:]$/.test(w) ? 420 : /,$/.test(w) ? 200 : 40); }
    await wait(380);
  }
}
function tween(to,ms){ const from = S.slide, t0 = performance.now();
  return new Promise(r => { (function step(){ const k = clamp((performance.now()-t0)/ms,0,1); S.slide = lerp(from,to,ease(k)); k<1 ? requestAnimationFrame(step) : r(); })(); }); }

/* ───────────── a night: find him, pick a story, find three things, listen ───────────── */
async function call(){
  if(S.phase!=='dark') return; S.phase = 'coming'; const run = ++S.run;
  hint(''); Snd.sfx('creak'); await wait(350); Snd.sfx('slideOut'); S.wave = true;
  await tween(1,1500); await wait(250);
  const left = STORIES.filter(s => !S.told.includes(s.id)).sort(() => Math.random()-.5).slice(0,3);
  const ii = Math.random()*(left.length===3 ? 3 : 2)|0;                      // "three stories" is only said when three are offered
  await speak(INTROS[ii],'intro'+(ii+1)); if(run!==S.run) return;
  S.wave = false; deal(left);
}
function deal(pool){
  cards.textContent = '';
  pool.forEach(s => { const b = document.createElement('button'); b.type = 'button'; b.className = 'card';
    b.appendChild(document.createElement('i')); b.appendChild(document.createTextNode(s.title));
    b.addEventListener('click',() => tell(s)); cards.appendChild(b); });
  cards.hidden = false; S.phase = 'cards'; Snd.sfx('deal'); hint(pool.length>1 ? 'pick a story from the floor.' : 'one story left. take it.');
}
function checklist(){ const h = S.hunt; cap.className = 'hint'; cap.textContent = '';
  const box = document.createElement('span'), lead = document.createElement('span'); lead.className = 'lead'; lead.textContent = 'first, find three things with your light: '; box.appendChild(lead);
  h.items.forEach((it,i) => { const sp = document.createElement('span'); sp.className = 'it'+(h.found.has(i) ? ' done' : ''); sp.textContent = it.label; box.appendChild(sp); if(i<2) box.appendChild(document.createTextNode(' · ')); });
  cap.appendChild(box); }
function find(i){ const h = S.hunt; if(!h || h.found.has(i)) return; h.found.add(i); h.last = performance.now(); h.at[i] = h.last; Snd.sfx('found'); checklist();
  if(h.found.size===3) h.done(); }
async function tell(s){
  if(S.phase!=='cards') return; const run = ++S.run;
  cards.hidden = true; S.story = s; S.phase = 'hunt';
  await new Promise(done => { S.hunt = { items:HUNT[s.id], found:new Set(), at:{}, last:performance.now(), done }; checklist(); });
  if(run!==S.run) return;
  await wait(900); S.phase = 'story'; S.storyT = performance.now(); hint('');
  Snd.setStory(s); Snd.loop('heartbeat',true); Snd.loop('candle',true); if(s.id==='musicbox') Snd.loop('musicbox',true);
  if(s.id==='door') Snd.sfx('knock');
  await wait(600); await speak(s.text,'story-'+s.id); if(run!==S.run) return;
  Snd.loop('heartbeat',false); Snd.loop('candle',false); Snd.loop('musicbox',false); Snd.setStory(null);
  S.phase = 'leaving'; S.hunt = null; S.story = null; S.told.push(s.id); status();
  const ni = Math.random()*NIGHTS.length|0; await wait(500); await speak(NIGHTS[ni],'night'+(ni+1)); if(run!==S.run) return;
  await wait(300); Snd.sfx('slideBack'); await tween(0,1400); Snd.sfx('creak'); S.eyes = 0;
  if(S.told.length>=6){ S.phase = 'end'; hint('that was the last story. he is asleep now. tap the room to begin the six nights again.'); }
  else { S.phase = 'dark'; hint('night '+night()+'. your light is a little smaller. shine it under the bed.'); }
  status();
}

/* ───────────── input ───────────── */
const frame = $('frame');
function toScene(e){ const r = cv.getBoundingClientRect(); return [clamp((e.clientX-r.left)/r.width*W,0,W), clamp((e.clientY-r.top)/r.height*H,0,H)]; }
const overEyes = (x,y) => x>GAP.x-4 && x<GAP.x+GAP.w+4 && y>GAP.y-6 && y<GAP.y+GAP.h+8;
let downSaw = false;
frame.addEventListener('pointermove',e => { if(S.phase==='title') return; [S.lx,S.ly] = toScene(e); });
frame.addEventListener('pointerdown',e => { if(S.phase==='title' || e.target.closest('#cards')) return;
  downSaw = S.eyes>.6; [S.lx,S.ly] = toScene(e); Snd.resume(); });
frame.addEventListener('pointerup',e => { if(e.target.closest('#cards') || e.target.closest('#start')) return; const [x,y] = toScene(e);
  if(S.phase==='dark'){ if(downSaw && overEyes(x,y)) call(); else Snd.sfx('click'); }
  else if(S.phase==='hunt'){ const h = S.hunt; let best = -1, bd = 1e9;
    h.items.forEach((it,i) => { const d = Math.hypot(it.x-x,it.y-y); if(!h.found.has(i) && d<it.r && d<bd){ bd = d; best = i; } });
    if(best>=0) find(best); else Snd.sfx('click'); }
  else if(S.phase==='end'){ S.told = []; S.phase = 'dark'; status(); Snd.sfx('click'); hint('night 1 again. shine your light under the bed.'); } });
frame.addEventListener('keydown',e => { if(e.key!=='Enter' && e.key!==' ') return; if(e.target!==frame) return; e.preventDefault();
  if(S.phase==='dark'){ if(S.eyes>.6) call(); else { S.lx = TOY.x; S.ly = 96; Snd.sfx('click'); } }
  else if(S.phase==='hunt'){ const i = S.hunt.items.findIndex((_,k) => !S.hunt.found.has(k)); if(i>=0){ const it = S.hunt.items[i]; if(Math.hypot(S.lx-it.x,S.ly-it.y)<2) find(i); else { S.lx = it.x; S.ly = it.y; Snd.sfx('click'); } } } });
$('begin').addEventListener('click',async () => {
  Snd.init(); Snd.resume(); $('begin').disabled = true; $('begin').textContent = 'one moment...';
  await Promise.race([Snd.preload(), wait(6000)]); $('start').hidden = true;
  S.phase = 'dark'; S.lx = 48; S.ly = 60; status();
  Snd.sfx('click'); Snd.loop('lullaby',true); Snd.loop('wind',true); S.lastCreak = performance.now();
  hint('night 1. it is very quiet. shine your light under the bed.'); frame.focus({preventScroll:true});
});
const mB = $('m-beeps'), mE = $('m-el');
function setMode(m){ mB.setAttribute('aria-pressed',m==='beeps'); mE.setAttribute('aria-pressed',m==='el'); Snd.setMode(m); status(); }
mB.addEventListener('click',() => setMode('beeps')); mE.addEventListener('click',() => setMode('el'));

/* ───────────── render ───────────── */
let K = 4, roomLayer = mk(8,8), toyLayer = mk(8,8), grain = null;
const DS = 2, dark = mk(W*DS,H*DS), dg = dark.getContext('2d');
function hole(x,y,r,a){ const gr = dg.createRadialGradient(x*DS,y*DS,r*DS*.3,x*DS,y*DS,r*DS); gr.addColorStop(0,`rgba(0,0,0,${a})`); gr.addColorStop(1,'rgba(0,0,0,0)'); dg.fillStyle = gr; dg.fillRect((x-r)*DS,(y-r)*DS,r*2*DS,r*2*DS); }
const calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const mainOf = s => HUNT[s.id][0];
function draw(now){
  const t = now/1000, st = S.story, inStory = S.phase==='story', h = S.hunt;
  const fl = calm ? .5 : (Math.sin(t*9.3)*.25+.25)+hash(Math.floor(t*(inStory?12:7)))*.5;      // candle flicker
  const R = LIGHT_R[night()-1];
  ctx.setTransform(1,0,0,1,0,0); ctx.drawImage(roomLayer,0,0); ctx.setTransform(K,0,0,K,0,0);

  // shadows that cross the wall while he talks
  if(inStory){ ctx.save(); ctx.beginPath(); ctx.rect(0,0,W,100); ctx.clip(); ctx.transform(1,0,.35,1,0,0);
    for(let i=0;i<3;i++){ const x = ((t*6+i*80)%250)-60, w = 22+i*5; ctx.fillStyle = LG(ctx,x,0,x+w,0,[0,A(P.ink,0)],[.5,A(P.ink,.6)],[1,A(P.ink,0)]); ctx.fillRect(x,0,w,100); }
    ctx.restore(); const sw = Math.sin(t*1.3)*2.4;
    ST(ctx,A(P.ink,.55),1.5,c => { c.moveTo(64,36); c.bezierCurveTo(72,30+sw,80,26-sw,90,21+sw); c.moveTo(74,30+sw*.5); c.quadraticCurveTo(78,35,80,41+sw); }); }

  // the ghost in the painting (it leaves its frame during its own story)
  { const gone = inStory && st.id==='ghosts' ? clamp(Math.sin(t*.7)*1.6+.5,0,1) : 1;
    ctx.globalAlpha = gone*.6; FP(ctx,P.bone,c => { c.moveTo(127.6,36.4); c.lineTo(127.6,29.6); c.bezierCurveTo(127.6,24.4,134.4,24.4,134.4,29.6); c.lineTo(134.4,36.4); c.quadraticCurveTo(133.3,34.8,132.2,36.4); c.quadraticCurveTo(131,34.8,129.9,36.4); c.quadraticCurveTo(128.7,34.8,127.6,36.4); });
    ctx.globalAlpha = gone; E(ctx,129.8,29.4,.55,.75,P.ink); E(ctx,132.2,29.4,.55,.75,P.ink); ctx.globalAlpha = 1; }
  // the dancer in the music box
  { const a = inStory && st.id==='musicbox' ? t*2.4 : .4; ST(ctx,P.bone,.5,c => { c.moveTo(60.2,74.4); c.lineTo(60.2,71.6); c.moveTo(60.2-Math.cos(a)*1.3,72.6); c.lineTo(60.2+Math.cos(a)*1.3,72.6); }); E(ctx,60.2,71,.6,.6,P.bone); }
  if(inStory){ const k = (now-S.storyT)/1000;
    if(st.id==='mirror' && k>17){ ctx.globalAlpha = clamp((k-17)/2,0,1); E(ctx,96,30.4,.5,.5,P.bone); E(ctx,100,30.4,.5,.5,P.bone); ST(ctx,P.bone,.5,c => { c.moveTo(95,34.6); c.quadraticCurveTo(98,38,101.4,33.8); }); ctx.globalAlpha = 1; }
    if(st.id==='door'){ ctx.fillStyle = LG(ctx,0,98,0,103,[0,A(P.red,0)],[1,A(P.red,.8)]); ctx.fillRect(4,98,20,5); ST(ctx,A(P.red,.7),.5,c => { c.moveTo(24.4,36); c.lineTo(24.4,102); }); }
    if(st.id==='attic'){ E(ctx,89.3,44.7,.8,.8,P.red); E(ctx,89.1,44.5,.25,.25,P.goldhi); } }
  // hidden things for this hunt
  if(h) h.items.forEach(it => it.draw && it.draw(ctx,t));

  // candle flame
  { const red = inStory && st.id==='candle', hgt = 4.4+fl*1.6+(inStory?1.2:0), lean = (fl-.5)*1.3;
    FP(ctx,RG(ctx,48,69,.2,hgt,[0,P.white],[.35,red?'#d2424f':P.goldhi],[1,A(red?P.red:P.gold,.15)]),c => { c.moveTo(46.9,69.4); c.bezierCurveTo(46.4,67.4,47.6+lean,66.4,48+lean,69.4-hgt); c.bezierCurveTo(48.6+lean,66.6,49.6,67.4,49.1,69.4); c.quadraticCurveTo(48,70.4,46.9,69.4); }); }

  // toyhead, sliding out from under the lace
  if(S.slide>.01){
    const tg = toyLayer.getContext('2d'); tg.setTransform(1,0,0,1,0,0); tg.clearRect(0,0,toyLayer.width,toyLayer.height); tg.setTransform(K,0,0,K,0,0);
    const look = S.phase==='hunt' ? clamp((S.lx-TOY.x)/30,-1,1) : S.phase==='cards' ? -.8 : 0;
    paintToy(tg,t,{ talk:S.talk && Math.floor(t*9)%2===0, blink:(t%3.7)<.14, wave:S.wave, look, rest:.25 });
    ctx.save(); ctx.beginPath(); ctx.rect(0,GAP.y,W,H-GAP.y); ctx.clip(); ctx.globalAlpha = clamp(S.slide*1.3,0,1);
    ctx.drawImage(toyLayer,TOY.x-35,TOY.y-30+lerp(-12,8,S.slide),70,84); ctx.restore();
  }

  // darkness, with soft holes for the flashlight, the candle, his face, and whatever was found
  dg.globalCompositeOperation = 'source-over'; dg.clearRect(0,0,dark.width,dark.height);
  dg.fillStyle = A(P.ink,S.phase==='title' ? 1 : inStory ? .68+fl*.05 : .82); dg.fillRect(0,0,dark.width,dark.height);
  dg.globalCompositeOperation = 'destination-out';
  hole(48,68,(inStory?34:19)+fl*4,.8);
  if(S.phase!=='title') hole(S.lx,S.ly,R*1.2,1);
  if(S.slide>.01) hole(TOY.x,TOY.y+10,40,.9*S.slide);
  if(h) h.items.forEach((it,i) => { if(h.found.has(i)) hole(it.x,it.y,it.r+5,.75); });
  ctx.drawImage(dark,0,0,W,H);

  if(S.phase!=='title') glow(ctx,S.lx,S.ly,R,P.bone,.05);
  if(h) h.items.forEach((it,i) => { if(!h.found.has(i)) return; const p = .5+.5*Math.sin(t*2.6+i), pop = clamp(1-(now-h.at[i])/600,0,1);
    glow(ctx,it.x,it.y,it.r+6+pop*10,inStory?P.red:P.gold,inStory ? .34+.2*p : .16+.3*pop); });
  if(inStory){ const m = mainOf(st); glow(ctx,m.x,m.y,m.r+12,P.red,.25+.15*Math.sin(t*2.2)); }
  ctx.globalCompositeOperation = 'source-over';
  if(h) h.items.forEach((it,i) => { if(!h.found.has(i)) return; ST(ctx,A(inStory?P.red:P.gold,.55),.5,c => { c.arc(it.x,it.y,it.r+1+Math.sin(t*2+i)*.6,0,TAU); }); });
  // if the player is stuck, the next thing glints
  if(S.phase==='hunt' && now-h.last>HINT_AFTER[night()-1]*1000){ const i = h.items.findIndex((_,k) => !h.found.has(k)), it = h.items[i], p = Math.max(0,Math.sin(t*3));
    if(it){ ctx.globalAlpha = p; ST(ctx,P.goldhi,.5,c => { c.moveTo(it.x-3,it.y); c.lineTo(it.x+3,it.y); c.moveTo(it.x,it.y-3); c.lineTo(it.x,it.y+3); }); E(ctx,it.x,it.y,.8,.8,P.white); ctx.globalAlpha = 1; } }

  // two eyes in the dark
  const lit = S.phase==='dark' && overEyes(S.lx,S.ly);
