.card:nth-child(3){transform:rotate(3deg);animation-delay:.24s}

.card:hover,.card:focus-visible{background:#fff8ea;box-shadow:0 0 0 var(--u) var(--ink),0 0 0 calc(var(--u)*2.2) var(--gold)}

<script>
(() => {

const STRANDS = [[-18,-10,-1,-.3,6],[-17,-4,-1,.5,6],[-19,2,-.6,1,6],[-14,-18,-.8,-1,6],[-8,-21,-.4,-1,6],[-2,-22,.1,-1,5],[5,-22,.5,-1,6],

  line(g,cx+13,cy-6,cx+10,cy-8,P.ink3); R(g,cx+5,cy-8,6,1,P.ink3); px(g,cx+4,cy-7,P.ink3);
  const look = s.look|0;
  eye(g,cx-7,cy+2,s.blink?9:0,look,s.blink); eye(g,cx+7,cy+2,s.blink?9:-1,look,s.blink);
  R(g,cx-1,cy+7,2,2,P.nose);
  // the small crooked smile
  R(g,cx-4,cy+11,8,1,P.ink4); px(g,cx-5,cy+10,P.ink4); px(g,cx+4,cy+10,P.ink4); px(g,cx+5,cy+9,P.ink4);
  if(s.talk) R(g,cx-2,cy+11,4,2,P.red3);
  // the stitched seam on his forehead
  R(g,cx+10,cy-11,1,6,P.ink4); [-10,-8,-6].forEach(y => { px(g,cx+9,cy+y,P.ink4); px(g,cx+11,cy+y,P.ink4); });
  // fringe of yarn
  [[-13,3],[-10,5],[-7,3],[-3,6],[1,3],[4,5],[7,2],[13,4],[-15,6]].forEach(([x,n],k) => { for(let i=0;i<n;i++) R(g,cx+x+(i>3?1:0),cy-14+i,2,1,(i+k)%3===0?P.hair2:P.hair); });
}

/* ───────────── sound: BEEPS (oscillators) / ELEVENLABS (assets) ───────────── */
const Snd = (() => {
  let ac = null, out = null, mode = 'beeps', timers = {}, story = null;
  const AC = window.AudioContext || window.webkitAudioContext;
  function init(){ if(ac || !AC) return; ac = new AC(); out = ac.createGain(); out.gain.value = 1; out.connect(ac.destination); }
  function tone(f,d,o={}){ if(!ac) return; const t0 = ac.currentTime+(o.t||0), os = ac.createOscillator(), g = ac.createGain();
    os.type = o.type||'sine'; os.frequency.setValueAtTime(f,t0); if(o.f2) os.frequency.exponentialRampToValueAtTime(o.f2,t0+d);
    g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(o.g||.15,t0+(o.a||.008)); g.gain.exponentialRampToValueAtTime(.0005,t0+d);
    os.connect(g); g.connect(out); os.start(t0); os.stop(t0+d+.05); }
  const N = {A3:220,E3:164.8,F3:174.6,D3:146.8,G4:392,A4:440,B4:493.9,C5:523.3,D5:587.3,E5:659.3,F4:349.2,Gs4:415.3,
             A5:880,C6:1046.5,E6:1318.5,Gs5:830.6,B5:987.8,D6:1174.7};
  const beeps = {
    click(){ tone(1900,.03,{type:'square',g:.16}); tone(900,.04,{type:'square',g:.1,t:.03}); },
    creak(){ tone(96,.5,{type:'sawtooth',f2:150,g:.13,a:.1}); tone(150,.4,{type:'sawtooth',f2:84,g:.1,t:.45,a:.05}); },
    slideOut(){ tone(90,1.2,{type:'triangle',f2:180,g:.3,a:.2}); },
    slideBack(){ tone(180,1.2,{type:'triangle',f2:85,g:.3,a:.2}); },
    blip(i){ tone(190+hash(i)*70,.08,{type:'triangle',g:.22}); },
    deal(){ [0,.12,.24].forEach((t,i) => tone(520+i*90,.05,{type:'square',g:.04,t})); },
    knock(){ [0,.22,.44].forEach(t => tone(120,.08,{type:'square',g:.08,t})); }
  };
  const LULL = ['A4',0,'C5','E5',0,'D5','C5',0,'B4','A4',0,0,'F4',0,'A4','C5',0,'B4','A4',0,'Gs4','A4',0,0];
  const BASS = ['A3','A3','E3','A3','F3','F3','E3','A3'];
  const BOX = ['E6','C6','A5','C6','E6','D6','B5','Gs5','A5','C6','E6','C6','B5','Gs5','A5',0];
  function every(name,ms,fn){ stopLoop(name); fn(0); let i = 1; timers[name] = setInterval(() => fn(i++),ms); }
  function stopLoop(name){ if(timers[name]){ clearInterval(timers[name]); delete timers[name]; } }
  const loops = {
    lullaby(){ every('lullaby',560,i => { const n = LULL[i%LULL.length]; if(n) tone(N[n],.9,{type:'triangle',g:story?.09:.07,a:.03});
      if(i%3===0) tone(N[BASS[(i/3|0)%BASS.length]]/2,1.5,{g:story?.1:.07,a:.05}); }); },
    wind(){ every('wind',2600,i => tone(190+hash(i)*90,2.6,{f2:170+hash(i+3)*120,g:.035,a:1.1})); },
    heartbeat(){ every('heartbeat',1050,() => { tone(90,.16,{f2:50,g:.3}); tone(80,.14,{f2:46,g:.22,t:.2}); }); },
    musicbox(){ every('musicbox',300,i => { const n = BOX[i%BOX.length]; if(n) tone(N[n],.5,{g:.05,a:.004}); }); },
    candle(){ every('candle',170,i => { if(hash(i*3.1)>.6) tone(2400+hash(i)*900,.02,{type:'triangle',g:.025}); }); }
  };
  return {
    init, get mode(){ return mode; }, get ready(){ return !!ac; },
    setMode(m){ mode = m; },
    sfx(name,arg){ if(!ac) return; (beeps[name]||(()=>{}))(arg); },
    loop(name,on){ if(!ac) return; if(on) loops[name](); else stopLoop(name); },
    setStory(s){ story = s; },
    resume(){ if(ac && ac.state==='suspended') ac.resume(); }
  };
})();

/* ───────────── state ───────────── */
const S = { phase:'title', lx:40, ly:60, slide:0, eyes:0, eyesSince:0, talk:false, wave:false, story:null, storyT:0, seen:[], run:0, lastCreak:0 };
const cap = $('caption'), cards = $('cards'), note = $('note');
const wait = ms => new Promise(r => setTimeout(r,ms));
const pick = a => a[Math.random()*a.length|0];
function hint(t){ cap.className = 'hint'; cap.textContent = t; }

/* captions: one sentence-sized chunk at a time, words lit as he says them */
function chunks(text){ const parts = text.match(/[^.?!:]+[.?!:]+/g) || [text], out = [];
  for(const p of parts.map(s => s.trim())){ if(out.length && (out[out.length-1]+' '+p).length < 46) out[out.length-1] += ' '+p; else out.push(p); }
  return out; }
async function speak(text){
  const run = S.run; let n = 0;
  for(const c of chunks(text)){
    cap.className = ''; cap.textContent = '';
    const line = document.createElement('span');
    const spans = c.split(' ').map(w => { const s = document.createElement('span'); s.className = 'w'; s.textContent = w+' '; line.appendChild(s); return s; });
    cap.appendChild(line);
    for(const s of spans){ if(run!==S.run) return;
      s.classList.add('on'); S.talk = true; Snd.sfx('blip',n++);
      const w = s.textContent.trim(); await wait(120+w.length*38); S.talk = false;
      await wait(/[.?!:]$/.test(w) ? 420 : /,$/.test(w) ? 200 : 40); }
    await wait(380);
  }
}
async function tween(to,ms){ const from = S.slide, t0 = performance.now();
  return new Promise(r => { (function step(){ const k = clamp((performance.now()-t0)/ms,0,1); S.slide = lerp(from,to,ease(k)); k<1 ? requestAnimationFrame(step) : r(); })(); }); }

async function call(){
  if(S.phase!=='dark') return; S.phase = 'coming'; const run = ++S.run;
  hint(''); Snd.sfx('creak'); await wait(350); Snd.sfx('slideOut'); S.wave = true;
  await tween(1,1500); await wait(250);
  await speak(pick(INTROS)); if(run!==S.run) return;
  S.wave = false; deal();
}
function deal(){
  const fresh = STORIES.filter(s => !S.seen.includes(s.id)); if(fresh.length<3) S.seen = [];
  const pool = (fresh.length>=3 ? fresh : STORIES).slice().sort(() => Math.random()-.5).slice(0,3);
  cards.textContent = '';
  pool.forEach(s => { const b = document.createElement('button'); b.type = 'button'; b.className = 'card';
    b.appendChild(document.createElement('i')); b.appendChild(document.createTextNode(s.title));
    b.addEventListener('click',() => tell(s)); cards.appendChild(b); });
  cards.hidden = false; S.phase = 'cards'; Snd.sfx('deal'); hint('pick a story from the floor.');
}
async function tell(s){
  if(S.phase!=='cards') return; S.phase = 'story'; const run = ++S.run;
  cards.hidden = true; S.seen.push(s.id); S.story = s; S.storyT = performance.now();
  Snd.setStory(s); Snd.loop('heartbeat',true); Snd.loop('candle',true); if(s.id==='musicbox') Snd.loop('musicbox',true);
  if(s.id==='door') Snd.sfx('knock');
  await wait(500); await speak(s.text); if(run!==S.run) return;
  Snd.loop('heartbeat',false); Snd.loop('candle',false); Snd.loop('musicbox',false); Snd.setStory(null); S.story = null;
  await wait(500); await speak(pick(NIGHTS)); if(run!==S.run) return;
  await wait(300); Snd.sfx('slideBack'); await tween(0,1400); Snd.sfx('creak');
  S.phase = 'dark'; S.eyes = 0; hint('he is back under the bed. shine your light to call him again.');
}

/* ───────────── input ───────────── */
const frame = $('frame');
function toScene(e){ const r = cv.getBoundingClientRect(); return [clamp((e.clientX-r.left)/r.width*W,0,W), clamp((e.clientY-r.top)/r.height*H,0,H)]; }
const overEyes = (x,y) => x>GAP.x-4 && x<GAP.x+GAP.w+4 && y>GAP.y-6 && y<GAP.y+GAP.h+8;
let downSaw = false;
frame.addEventListener('pointermove',e => { if(S.phase==='title') return; [S.lx,S.ly] = toScene(e); });
frame.addEventListener('pointerdown',e => { if(S.phase==='title' || e.target.closest('#cards')) return;
  downSaw = S.eyes>.6; [S.lx,S.ly] = toScene(e); Snd.resume(); });
frame.addEventListener('pointerup',e => { if(S.phase!=='dark' || e.target.closest('#cards')) return;
  const [x,y] = toScene(e); if(downSaw && overEyes(x,y)) call(); else Snd.sfx('click'); });
frame.addEventListener('keydown',e => { if(e.key!=='Enter' && e.key!==' ') return; if(e.target!==frame || S.phase!=='dark') return; e.preventDefault();
  if(S.eyes>.6) call(); else { S.lx = TOY.x; S.ly = 96; Snd.sfx('click'); } });
$('begin').addEventListener('click',() => {
  Snd.init(); Snd.resume(); $('start').hidden = true; S.phase = 'dark'; S.lx = 48; S.ly = 60;
  Snd.sfx('click'); Snd.loop('lullaby',true); Snd.loop('wind',true); S.lastCreak = performance.now();
  hint('it is very quiet. shine your light under the bed.'); frame.focus({preventScroll:true});
});
const mB = $('m-beeps'), mE = $('m-el');
function setMode(m){
  mB.setAttribute('aria-pressed',m==='beeps'); mE.setAttribute('aria-pressed',m==='el');
  Snd.setMode(m);
  note.textContent = (m==='el' && !EL_READY) ? 'elevenlabs audio is not recorded yet. playing beeps for now.' : '';
}
mB.addEventListener('click',() => setMode('beeps')); mE.addEventListener('click',() => setMode('el'));

/* ───────────── render ───────────── */
function hole(g,x,y,r,a){ g.globalAlpha = a; ell(g,x,y,r,r,'#000'); g.globalAlpha = 1; }
function halo(x,y,r,c,a){ ctx.globalAlpha = a; ell(ctx,x,y,r,r,c); ctx.globalAlpha = 1; }
const calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function draw(now){
  const t = now/1000, st = S.story, inStory = !!st;
  const fl = calm ? .5 : hash(Math.floor(t*(inStory?11:7)));          // candle flicker, stepped
  ctx.drawImage(room,0,0);

  // shadows that move while he talks
  if(inStory){ ctx.fillStyle = 'rgba(11,11,13,.5)';
    for(let i=0;i<3;i++){ const x = ((t*7+i*75)%230)-40; for(let y=0;y<100;y+=4) ctx.fillRect(Math.round(x+y*.35+Math.sin(t+i)*3),y,12+i*3,4); }
    const sway = Math.round(Math.sin(t*1.3)*2); line(ctx,66,30+sway,84,22-sway,'rgba(11,11,13,.6)',2); line(ctx,72,27+sway,78,36,'rgba(11,11,13,.6)'); }

  // candle flame
  const fx = 48+(fl>.8?1:fl<.15?-1:0), tall = inStory && fl>.5 ? 5 : 4, fc = st && st.obj==='candle';
  R(ctx,47,70-tall+1,3,tall-1,fc?P.red:P.gold); R(ctx,fx,70-tall,1,2,fc?P.gold:P.goldhi); px(ctx,48,69,P.goldhi);

  // story object, lit from inside
  if(inStory){ const [ox,oy] = OBJ[st.obj], k = (now-S.storyT)/1000;
    if(st.obj==='mirror'){ ell(ctx,98,33,6,9,P.red3); if(k>18){ px(ctx,96,30,P.bone); px(ctx,100,30,P.bone); R(ctx,96,36,4,1,P.bone); px(ctx,95,35,P.bone); px(ctx,100,35,P.bone); px(ctx,101,34,P.bone); } }
    if(st.obj==='musicbox'){ const a = Math.floor(t*3)%4; px(ctx,60,72,P.bone); R(ctx,59,73,3,1,P.ink2); px(ctx,[59,60,61,60][a],73,P.bone); px(ctx,60,73,P.bone); R(ctx,56,75,9,1,P.gold); }
    if(st.obj==='painting'){ const gone = Math.sin(t*.8)>.2; if(gone){ R(ctx,122,22,18,16,P.red3); } else { px(ctx,130,28,P.red); px(ctx,132,28,P.red); } }
    if(st.obj==='door'){ R(ctx,25,37,1,63,P.red); R(ctx,5,99,18,1,P.red); if(Math.floor(t*2)%5===0) R(ctx,20,66,2,2,P.goldhi); }
    if(st.obj==='bear'){ px(ctx,89,44,P.red); R(ctx,90,52,3,3,P.red2); }
  }

  // toyhead, sliding out from under the lace
  if(S.slide>.01){
    drawToy(tg,t,{ talk:S.talk && Math.floor(t*9)%2===0, blink:(t%3.7)<.14, wave:S.wave, look:S.phase==='cards'?-1:0 });
    ctx.save(); ctx.beginPath(); ctx.rect(0,GAP.y,W,H-GAP.y); ctx.clip();
    ctx.globalAlpha = clamp(S.slide*1.3,0,1);
    ctx.drawImage(toy,TOY.x-32,Math.round(TOY.y-28+lerp(-12,8,S.slide)));
    ctx.restore();
  }

  // darkness, with holes punched by the flashlight, the candle, and his face
  dg.globalCompositeOperation = 'source-over'; dg.clearRect(0,0,W,H);
  dg.globalAlpha = S.phase==='title' ? 1 : inStory ? .76+fl*.08 : .84; dg.fillStyle = P.ink; dg.fillRect(0,0,W,H); dg.globalAlpha = 1;
  dg.globalCompositeOperation = 'destination-out';
  const cr = (inStory?19:11)+Math.round(fl*3);
  hole(dg,48,68,cr,.3); hole(dg,48,68,cr-5,.45); hole(dg,48,68,cr-8,.8);
  if(S.phase!=='title'){ const lx = Math.round(S.lx), ly = Math.round(S.ly);
    hole(dg,lx,ly,29,.3); hole(dg,lx,ly,24,.5); hole(dg,lx,ly,18,1); }
  if(S.slide>.01){ hole(dg,TOY.x,TOY.y+12,36,.35*S.slide); hole(dg,TOY.x,TOY.y+10,28,.85*S.slide); }
  if(inStory){ const [ox,oy] = OBJ[st.obj]; hole(dg,ox,oy,15,.4); hole(dg,ox,oy,10,.8); }
  ctx.drawImage(dark,0,0);

  // warm and red light on top
  halo(48,68,cr-4,P.gold,.05+fl*.03);
  if(inStory){ const [ox,oy] = OBJ[st.obj], p = .5+.5*Math.sin(t*2.6);
    halo(ox,oy,16,P.red,.1+.1*p); halo(ox,oy,10,P.red,.14+.12*p); }

  // two eyes in the dark
  const lit = S.phase==='dark' && overEyes(S.lx,S.ly);
  S.eyes = clamp(S.eyes+(lit?.07:-.12),0,1);
  if(S.phase==='dark' && S.eyes>.05){
    const bl = (t%2.9)<.13 || ((t+1.3)%7.1)<.12, open = bl ? 0 : S.eyes;
    const look = clamp(Math.round((S.lx-TOY.x)/14),-1,1), ey = TOY.y-28-12+30;
    [-7,7].forEach(dx => { const ex = TOY.x+dx;
      if(open<.3){ R(ctx,ex-3,ey+1,7,1,P.bone3); return; }
      const top = open<.7 ? 1 : 0;
      for(let dy=top;dy<=3;dy++){ const w = Math.round(5*Math.sqrt(1-(dy*dy)/16)); R(ctx,ex-w,ey+dy,w*2+1,1,P.bone); }
      R(ctx,ex-1+look,ey+top,3,3-top,P.gold); px(ctx,ex+look,ey+1,P.ink); });
  }
  // an idle creak now and then, so the bed gives itself away
  if(S.phase==='dark' && now-S.lastCreak>16000){ S.lastCreak = now; Snd.sfx('creak'); }
  requestAnimationFrame(draw);
}

/* ───────────── fit ───────────── */
function fit(){ const st = $('stage'), k = Math.min(st.clientWidth/W, st.clientHeight/H); if(!(k>0)) return;
  const s = k>=3 ? Math.floor(k*2)/2 : k;
  frame.style.width = (W*s)+'px'; frame.style.height = (H*s)+'px'; document.documentElement.style.setProperty('--u',s+'px'); }
window.addEventListener('resize',fit); new ResizeObserver(fit).observe($('stage')); fit();
requestAnimationFrame(draw);
window.__utb = { S, call, tell, STORIES };
})();
</script>
